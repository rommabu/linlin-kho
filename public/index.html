<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Film Studio — Quản lý dự án làm phim bằng AI</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" data-nav="projects">🎬 AI Film Studio</div>
      <div id="project-tabs" class="tabs hidden"></div>
    </header>

    <main id="view-root"></main>

    <div id="toast" class="toast hidden"></div>
  </div>

  <template id="tpl-project-card">
    <div class="card project-card">
      <h3 class="p-name"></h3>
      <p class="p-logline muted"></p>
      <div class="p-meta">
        <span class="badge p-status"></span>
        <span class="p-updated muted"></span>
      </div>
      <div class="card-actions">
        <button class="btn btn-primary btn-open">Mở dự án</button>
        <button class="btn btn-danger btn-delete">Xoá</button>
      </div>
    </div>
  </template>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
